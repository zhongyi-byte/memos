name: Android APK

on:
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - ".github/workflows/android-apk.yml"
      - "web/**"
  workflow_dispatch:
    inputs:
      server_url:
        description: "Optional Memos server URL for the Android wrapper, for example https://memos.example.com"
        required: false
        type: string
      release_tag:
        description: "Optional Git tag to publish the APK to a GitHub Release, for example android-v0.1.0"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"
  JAVA_VERSION: "21"
  CAPACITOR_SERVER_URL: ${{ github.event.inputs.server_url || '' }}

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.2.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build debug APK
        working-directory: web
        run: pnpm run android:apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: memos-android-debug-apk
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release asset
        if: ${{ github.event.inputs.release_tag != '' }}
        run: |
          mkdir -p release
          cp web/android/app/build/outputs/apk/debug/app-debug.apk "release/memos-${{ github.event.inputs.release_tag }}.apk"

      - name: Publish GitHub release
        if: ${{ github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: true
          files: release/memos-${{ github.event.inputs.release_tag }}.apk
